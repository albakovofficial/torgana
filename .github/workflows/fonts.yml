# Временный: скачивает шрифт Onest с Google Fonts, сверяет контрольные суммы и кладёт в ветку.
# Удаляется следующим коммитом.
name: Шрифт Onest
on:
  push:
    branches: [feature/self-host-font]
    paths: [.github/workflows/fonts.yml]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Скачать и проверить
        run: |
          set -euo pipefail
          mkdir -p public/assets/fonts
          dl() { curl -fsSL "https://fonts.gstatic.com/s/onest/v11/$2.woff2" -o "public/assets/fonts/onest-$1.woff2"; echo "$3  public/assets/fonts/onest-$1.woff2" | sha256sum -c -; }
          dl cyrillic      gNMKW3F-SZuj7xmb-HY6EQ 68e5e01d6265bd68967746d4f5a9d18d0e6cbb5d15583c7082d6384ab1229b27
          dl cyrillic-ext  gNMKW3F-SZuj7xmS-HY6EQ 268f03691b3d06e57abcf20f9277e314ea8784298983aab5b40c1b91965027e1
          dl latin         gNMKW3F-SZuj7xmf-HY    052df74533250c2e0ca0c4bdd32de594e107d99c1648e63820ef9c6142067828
          dl latin-ext     gNMKW3F-SZuj7xmR-HY6EQ 14e7d3079b75860e2ab50efc6c318c398fdb46ede9b56e625f12ae70a3c5d9a4
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/onest/OFL.txt -o public/assets/fonts/OFL.txt
          ls -l public/assets/fonts
      - name: Сохранить в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/fonts
          git commit -m "Шрифт Onest (OFL 1.1): woff2 с Google Fonts, суммы проверены"
          git push
