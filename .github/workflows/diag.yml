name: Диагностика из России
on: { push: { branches: [diag-ru] } }
permissions: {}
jobs:
  ru:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          H='Accept: application/json'
          all=$(curl -s -m 20 -H "$H" https://check-host.net/nodes/hosts)
          nodes="$(echo "$all" | jq -r '.nodes | to_entries[] | select(.value.location[0]=="ru") | .key') $(echo "$all" | jq -r '.nodes | to_entries[] | select(.value.location[0]=="de" or .value.location[0]=="nl" or .value.location[0]=="kz") | .key' | head -3)"
          q=$(for n in $nodes; do printf '&node=%s' "$n"; done)
          run() {
            id=$(curl -s -m 20 -H "$H" "https://check-host.net/check-$1?host=$2$q" | jq -r .request_id)
            echo "=== $1 $2 ($id)"
            for i in $(seq 1 12); do
              sleep 10
              r=$(curl -s -m 20 -H "$H" https://check-host.net/check-result/$id)
              echo "$r" | jq -e 'all(.[]; . != null)' >/dev/null && break
            done
            echo "$r" | jq -c 'to_entries[] | {node: .key, r: .value}'
          }
          run http https://torgana.ru/api/config
          run http https://torgana.ru/
          run tcp torgana.ru:443
          run tcp torgana.ru:80
          run ping torgana.ru
          run http https://ya.ru/
